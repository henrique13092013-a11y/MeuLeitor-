<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#111827" />
  <title>Leitor Acadêmico</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <strong>Leitor Acadêmico</strong>
      <span id="fileName">Nenhum PDF aberto</span>
    </div>
    <div class="top-actions">
      <button id="themeBtn" class="icon-btn" title="Alternar tema">◐</button>
      <label class="open-btn">Abrir PDF<input id="fileInput" type="file" accept="application/pdf,.pdf" hidden /></label>
    </div>
  </header>

  <main>
    <section id="emptyState" class="empty-state">
      <div class="empty-card">
        <div class="book-icon">▤</div>
        <h1>Leia scans de livros sem sofrimento</h1>
        <p>Abra um PDF do seu aparelho. O arquivo permanece local: nada é enviado ao site.</p>
        <label class="primary-open">Selecionar PDF<input id="fileInputBig" type="file" accept="application/pdf,.pdf" hidden /></label>
        <div class="feature-grid">
          <span>↻ Rotação</span><span>✂ Página dupla</span><span>▣ Corte de margens</span><span>↔ Ajuste à tela</span>
        </div>
      </div>
    </section>

    <section id="reader" class="reader hidden">
      <aside id="controls" class="controls">
        <div class="controls-head"><b>Ajustes</b><button id="controlsClose" class="controls-close" aria-label="Fechar ajustes">×</button></div>

        <label class="switch-row smart-row">
          <span><b>Modo inteligente</b><small>Analisa cada página separadamente</small></span>
          <input id="smartToggle" type="checkbox" checked />
        </label>
        <div id="smartStatus" class="smart-status">Automático por página</div>

        <div class="control-row compact">
          <button id="rotateLeftBtn" title="Girar 90° à esquerda">↶</button>
          <button id="rotateRightBtn" title="Girar 90° à direita">↷</button>
          <button id="zoomOutBtn" title="Diminuir zoom">−</button>
          <span id="zoomLabel">100%</span>
          <button id="zoomInBtn" title="Aumentar zoom">＋</button>
          <button id="fitBtn" title="Ajustar à largura">↔</button>
        </div>

        <div class="control-group">
          <label class="switch-row">
            <span><b>Forçar página dupla</b><small>Use se o automático não detectar</small></span>
            <input id="splitToggle" type="checkbox" />
          </label>
          <label class="switch-row sub">
            <span>Ao forçar, somente se estiver horizontal</span>
            <input id="autoLandscape" type="checkbox" checked />
          </label>
          <label class="slider-row">
            <span>Posição do corte <output id="splitOutput">50%</output></span>
            <input id="splitSlider" type="range" min="40" max="60" value="50" step="0.5" />
          </label>
          <label class="slider-row">
            <span>Remover lombada <output id="gutterOutput">1.0%</output></span>
            <input id="gutterSlider" type="range" min="0" max="6" value="1" step="0.25" />
          </label>
        </div>

        <div class="control-group">
          <label class="switch-row">
            <span><b>Cortar margens</b><small>Recorta as bordas do scan</small></span>
            <input id="cropToggle" type="checkbox" />
          </label>
          <label class="slider-row">
            <span>Margem externa <output id="cropOutput">3%</output></span>
            <input id="cropSlider" type="range" min="0" max="14" value="3" step="0.5" />
          </label>
        </div>

        <div class="control-group">
          <label class="switch-row">
            <span><b>Ordem de leitura</b><small>Esquerda → direita</small></span>
            <input id="rtlToggle" type="checkbox" />
          </label>
        </div>
      </aside>

      <button id="controlsToggle" class="controls-toggle">Ajustes</button>

      <section id="stage" class="stage" aria-label="Página do PDF">
        <div id="loading" class="loading hidden">Carregando…</div>
        <div id="canvasWrap" class="canvas-wrap"><canvas id="pageCanvas"></canvas></div>
      </section>

      <nav class="bottom-nav">
        <button id="prevBtn" class="nav-btn" aria-label="Página anterior">‹</button>
        <div class="page-info">
          <b id="pageLabel">—</b>
          <span id="sideLabel"></span>
        </div>
        <button id="nextBtn" class="nav-btn" aria-label="Próxima página">›</button>
      </nav>
    </section>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
